version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_DATABASE: java
      MYSQL_ROOT_PASSWORD: 14263208@aA
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p14263208@aA"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: blog-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/java?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 14263208@aA
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-environment
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
